  <rect x="80" y="80" width="1760" height="920" fill="none" stroke="#60D8F6" stroke-width="1" opacity="0.12"/>
  <path d="M 80 140 L 80 80 L 140 80" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 1840 140 L 1840 80 L 1780 80" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 80 940 L 80 1000 L 140 1000" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 1840 940 L 1840 1000 L 1780 1000" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Center Crosshairs -->
  <line x1="950" y1="540" x2="970" y2="540" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
  <line x1="960" y1="530" x2="960" y2="550" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>

  <!-- Creative Motif -->
  
      <g opacity="0.25" stroke="#3B82F6" stroke-width="1">
        <line x1="200" y1="540" x2="1720" y2="540" />
        <line x1="200" y1="620" x2="1720" y2="620" />
        <line x1="200" y1="700" x2="1720" y2="700" />
        <line x1="200" y1="780" x2="1720" y2="780" />
        <line x1="960" y1="540" x2="200" y2="900" />
        <line x1="960" y1="540" x2="500" y2="900" />
        <line x1="960" y1="540" x2="800" y2="900" />
        <line x1="960" y1="540" x2="1120" y2="900" />
        <line x1="960" y1="540" x2="1420" y2="900" />
        <line x1="960" y1="540" x2="1720" y2="900" />
      </g>
      <rect x="760" y="320" width="400" height="220" rx="12" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.5"/>
    

  <!-- Cinematic Letterbox Metadata -->
  <text x="120" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#3B82F6" opacity="0.9">AI CREATOR STORY LAB // SPEC 2.39:1</text>
  <text x="1800" y="140" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#DBEAFE" opacity="0.6">4K CINEMATIC MASTER</text>

  <!-- Tag Pill -->
  <rect x="120" y="820" width="304" height="32" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="272" y="841" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#FFFFFF">REAL ESTATE PROMOTIONS</text>

  <!-- Title & Subtitle -->
  <text x="120" y="910" font-family="Georgia, serif" font-size="54" font-weight="bold" letter-spacing="1" fill="url(#textGrad)">The Glass Horizon</text>
  <text x="120" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" letter-spacing="1" fill="#94A3B8">Cliffside Sanctuary // Architectural Tour</text>
