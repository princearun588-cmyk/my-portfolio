<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="45%" stop-color="#08172E" />
      <stop offset="100%" stop-color="#0F264A" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Deep cinematic base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Atmospheric Glow Orb -->
  <circle cx="960" cy="520" r="480" fill="url(#glow)" filter="url(#blurFilter)"/>

